<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FEX — All of your traffic, becomes more revenue</title>
<style>
  :root{
    --bg:#08080c;
    --ink:#f4f5f7;
    --muted:#9aa0ad;
    /* blue base + warm accent so it isn't cold */
    --blue-1:#9cb8ff;
    --blue-2:#6f97ff;
    --blue-3:#3f6bff;
    --warm:#ff9a6b;      /* warm coral accent */
    --warm-2:#ffb98a;
    --human:#6f97ff;
    --agent:#9cb8ff;
    --money:#ffa877;
    --line:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  /* ambient glow */
  .bg-glow{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(620px 420px at 20% 16%, rgba(111,151,255,.16), transparent 60%),
      radial-gradient(560px 380px at 82% 24%, rgba(255,154,107,.13), transparent 60%),
      radial-gradient(900px 620px at 55% 118%, rgba(255,154,107,.10), transparent 60%);
  }
  .grid-overlay{
    position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.25;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:64px 64px;
    mask-image:radial-gradient(circle at 50% 40%, black, transparent 75%);
  }

  nav{
    position:relative;z-index:3;
    display:flex;align-items:center;justify-content:space-between;
    padding:26px 40px;max-width:1280px;margin:0 auto;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.2px}
  .brand .dot{width:13px;height:13px;border-radius:50%;
    background:conic-gradient(from 210deg,var(--blue-1),var(--blue-3),#1e3aaa,var(--blue-2),var(--blue-1));
    box-shadow:0 0 18px rgba(111,151,255,.55)}
  .brand span{font-size:18px;letter-spacing:.14em;font-weight:680}
  .nav-cta{
    font-size:14px;color:var(--muted);border:1px solid var(--line);
    padding:9px 16px;border-radius:999px;text-decoration:none;transition:.2s;
  }
  .nav-cta:hover{color:var(--ink);border-color:rgba(255,255,255,.25)}

  .hero{
    position:relative;z-index:2;
    max-width:1280px;margin:0 auto;
    display:grid;grid-template-columns:1.05fr .95fr;gap:40px;
    align-items:center;
    padding:40px 40px 90px;
    min-height:calc(100vh - 92px);
  }
  .copy{max-width:600px}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);border:1px solid var(--line);
    padding:7px 13px;border-radius:999px;margin-bottom:26px;
    opacity:0;transform:translateY(10px);animation:rise .7s .1s forwards;
  }
  .eyebrow .pulse{width:7px;height:7px;border-radius:50%;background:var(--money);
    box-shadow:0 0 0 0 rgba(95,224,138,.6);animation:ping 2.2s infinite}
  h1{
    font-size:clamp(46px,6.4vw,82px);
    line-height:1.02;letter-spacing:-.025em;font-weight:660;
    margin-bottom:26px;
  }
  h1 .accent{
    background:linear-gradient(100deg,var(--blue-2) 0%,var(--warm) 118%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .h1-l1{display:block;opacity:0;transform:translateY(16px);animation:rise .8s .18s forwards}
  .h1-l2{display:block;opacity:0;transform:translateY(16px);animation:rise .8s .3s forwards}
  .sub{
    font-size:clamp(16px,1.5vw,19px);line-height:1.6;color:var(--muted);
    max-width:520px;margin-bottom:38px;
    opacity:0;transform:translateY(16px);animation:rise .8s .44s forwards;
  }
  .sub b{color:#d7dbe3;font-weight:600}
  .actions{display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    opacity:0;transform:translateY(16px);animation:rise .8s .58s forwards}
  .btn-primary{
    display:inline-flex;align-items:center;gap:11px;
    background:linear-gradient(100deg,#ff8f5e,#ffb488);
    color:#22120a;font-weight:680;font-size:16px;
    padding:16px 30px;border-radius:14px;text-decoration:none;
    box-shadow:0 8px 34px rgba(255,138,90,.32);transition:.25s;
  }
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 44px rgba(255,138,90,.46)}
  .btn-secondary{
    display:inline-flex;align-items:center;gap:10px;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);
    color:var(--ink);font-weight:560;font-size:15px;
    padding:15px 24px;border-radius:14px;text-decoration:none;transition:.25s;
    backdrop-filter:blur(6px);
  }
  .btn-secondary:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.26);transform:translateY(-2px)}
  .btn-secondary .play{
    width:22px;height:22px;border-radius:50%;
    background:rgba(255,255,255,.14);display:grid;place-items:center;
  }

  /* ---- VISUAL ---- */
  .visual{position:relative;height:520px;
    opacity:0;animation:fade 1.1s .5s forwards}
  .stage{position:absolute;inset:0}

  .stream-label{
    position:absolute;top:0;font-size:12px;letter-spacing:.06em;
    text-transform:uppercase;display:flex;flex-direction:column;gap:2px;color:var(--muted)
  }
  .stream-label .ttl{display:flex;align-items:center;gap:7px;font-weight:600;color:#c4cad6}
  .stream-label .sub{font-size:9.5px;letter-spacing:.04em;color:#6b7180;text-transform:none}
  .stream-label .chip{width:9px;height:9px;border-radius:2px}
  .label-human{left:5%;align-items:flex-start}
  .label-human .chip{background:var(--blue-2);box-shadow:0 0 12px var(--blue-2)}
  .label-agent{right:5%;align-items:flex-end;text-align:right}
  .label-agent .chip{background:var(--warm);box-shadow:0 0 12px var(--warm)}

  svg.flow{position:absolute;inset:0;width:100%;height:100%;overflow:visible}

  .revenue-badge{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
    text-align:center;
  }
  .revenue-badge .amt{
    font-size:38px;font-weight:700;letter-spacing:-.02em;
    background:linear-gradient(100deg,var(--warm),#ffe6d3);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-variant-numeric:tabular-nums;
  }
  .revenue-badge .cap{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}

  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  @keyframes fade{to{opacity:1}}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(95,224,138,.6)}70%{box-shadow:0 0 0 9px rgba(95,224,138,0)}100%{box-shadow:0 0 0 0 rgba(95,224,138,0)}}

  @media(max-width:920px){
    .hero{grid-template-columns:1fr;gap:20px;padding-bottom:60px}
    .visual{height:400px;order:2}
    nav{padding:22px 24px}
    .hero{padding-left:24px;padding-right:24px}
  }
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="grid-overlay"></div>

<nav>
  <div class="brand"><div class="dot"></div><span>FEX</span></div>
</nav>

<section class="hero">
  <div class="copy">
    <h1>
      <span class="h1-l1">All of your traffic,</span>
      <span class="h1-l2">becomes <span class="accent">more revenue.</span></span>
    </h1>
    <p class="sub">
      We turn both <b>human visitors</b> and the <b>agentic traffic</b> buying for them into conversions.
      Measured in dollars, not dashboards.
    </p>
    <div class="actions">
      <a class="btn-primary" href="#">Talk to Sales</a>
      <a class="btn-secondary" href="#">
        Watch Demo
        <span class="play">
          <svg width="9" height="11" viewBox="0 0 10 12" fill="none"><path d="M0 0.8v10.4L10 6 0 0.8Z" fill="#fff"/></svg>
        </span>
      </a>
    </div>
  </div>

  <div class="visual">
    <div class="stage">
      <div class="stream-label label-human"><span class="ttl"><span class="chip"></span>Humans</span><span class="sub">via paid ads &middot; CRO</span></div>
      <div class="stream-label label-agent"><span class="ttl">AI Agents<span class="chip"></span></span><span class="sub">via discovery &middot; AEO</span></div>

      <svg class="flow" viewBox="0 0 560 580" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="gHuman" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#6f97ff" stop-opacity=".0"/>
            <stop offset="1" stop-color="#6f97ff" stop-opacity=".85"/>
          </linearGradient>
          <linearGradient id="gAgent" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffb98a" stop-opacity=".0"/>
            <stop offset="1" stop-color="#ffb98a" stop-opacity=".85"/>
          </linearGradient>
          <linearGradient id="gMoney" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#6f97ff"/>
            <stop offset="1" stop-color="#ffa877"/>
          </linearGradient>
          <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="3.2" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <!-- ============ HUMANS LANE (left) : Ads -> LP -> Cart ============ -->
        <!-- source: real ad platform logos -->
        <g id="srcHuman" font-family="inherit">
          <g transform="translate(60,48)">
            <rect x="-26" y="-20" width="52" height="40" rx="11" fill="rgba(255,255,255,.05)" stroke="rgba(111,151,255,.28)"/>
            <image href="assets/google-ads.webp" x="-12" y="-13" width="24" height="24"/>
          </g>
          <g transform="translate(126,40)">
            <rect x="-26" y="-20" width="52" height="40" rx="11" fill="rgba(255,255,255,.05)" stroke="rgba(111,151,255,.28)"/>
            <image href="assets/meta.svg" x="-12" y="-12" width="24" height="24"/>
          </g>
          <g transform="translate(192,48)">
            <rect x="-26" y="-20" width="52" height="40" rx="11" fill="rgba(255,255,255,.05)" stroke="rgba(111,151,255,.28)"/>
            <image href="assets/tiktok.svg" x="-11" y="-11" width="22" height="22"/>
          </g>
        </g>

        <!-- humans lane container (subtle) -->
        <path d="M40 88 L210 88 L165 300" fill="none" stroke="rgba(111,151,255,.12)" stroke-width="1.4"/>

        <!-- STAGE: AD -->
        <g transform="translate(125,140)">
          <rect x="-48" y="-24" width="96" height="48" rx="7" fill="#0f1320" stroke="rgba(111,151,255,.5)" stroke-width="1.1"/>
          <rect x="-40" y="-16" width="34" height="32" rx="3" fill="rgba(111,151,255,.2)"/>
          <circle cx="-23" cy="0" r="5" fill="rgba(111,151,255,.55)"/>
          <rect x="2" y="-14" width="38" height="5" rx="2.5" fill="rgba(255,255,255,.35)"/>
          <rect x="2" y="-5" width="28" height="4" rx="2" fill="rgba(255,255,255,.16)"/>
          <rect x="2" y="5" width="22" height="8" rx="3" fill="#6f97ff"/>
          <text x="0" y="-33" fill="#8b93a5" font-size="8.5" text-anchor="middle" letter-spacing=".1em">AD</text>
        </g>
        <!-- STAGE: LANDING -->
        <g transform="translate(148,222)">
          <rect x="-40" y="-22" width="80" height="44" rx="6" fill="#0f1320" stroke="rgba(111,151,255,.5)" stroke-width="1.1"/>
          <rect x="-40" y="-22" width="80" height="10" rx="6" fill="rgba(111,151,255,.16)"/>
          <rect x="-32" y="-5" width="44" height="5" rx="2.5" fill="rgba(255,255,255,.32)"/>
          <rect x="-32" y="4" width="32" height="4" rx="2" fill="rgba(255,255,255,.15)"/>
          <rect x="-32" y="12" width="20" height="6" rx="3" fill="#6f97ff"/>
          <rect x="18" y="-5" width="16" height="23" rx="3" fill="rgba(111,151,255,.2)"/>
          <text x="0" y="-30" fill="#8b93a5" font-size="8.5" text-anchor="middle" letter-spacing=".1em">LANDING</text>
        </g>

        <!-- humans leaks -->
        <circle class="leak" cx="95" cy="185" r="3.6" fill="#ff5c72"/>
        <circle class="leak" cx="185" cy="170" r="3.6" fill="#ff5c72"/>

        <!-- ============ AGENTS LANE (right) : Discovery -> AEO -> API buy ============ -->
        <!-- source: AI discovery surfaces -->
        <g id="srcAgent" font-family="inherit">
          <g transform="translate(500,48)">
            <rect x="-26" y="-20" width="52" height="40" rx="11" fill="rgba(255,255,255,.05)" stroke="rgba(255,168,119,.3)"/>
            <image href="assets/openai.svg" x="-12" y="-12" width="24" height="24"/>
          </g>
          <g transform="translate(434,40)">
            <rect x="-26" y="-20" width="52" height="40" rx="11" fill="rgba(255,255,255,.05)" stroke="rgba(255,168,119,.3)"/>
            <image href="assets/perplexity.svg" x="-12" y="-12" width="24" height="24"/>
          </g>
          <g transform="translate(368,48)">
            <rect x="-26" y="-20" width="52" height="40" rx="11" fill="rgba(255,255,255,.05)" stroke="rgba(255,168,119,.3)"/>
            <image href="assets/gemini.svg" x="-12" y="-12" width="24" height="24"/>
          </g>
        </g>

        <path d="M520 88 L350 88 L395 300" fill="none" stroke="rgba(255,168,119,.12)" stroke-width="1.4"/>

        <!-- STAGE: DISCOVERY (agent query/answer) -->
        <g transform="translate(435,140)">
          <rect x="-48" y="-24" width="96" height="48" rx="7" fill="#150f0a" stroke="rgba(255,168,119,.5)" stroke-width="1.1"/>
          <circle cx="-34" cy="-10" r="3" fill="#ffa877"/>
          <rect x="-27" y="-13" width="30" height="5" rx="2.5" fill="rgba(255,255,255,.3)"/>
          <rect x="-27" y="-4" width="40" height="4" rx="2" fill="rgba(255,255,255,.16)"/>
          <rect x="-34" y="6" width="20" height="4" rx="2" fill="rgba(255,168,119,.5)"/>
          <rect x="-11" y="6" width="26" height="4" rx="2" fill="rgba(255,168,119,.3)"/>
          <text x="0" y="-33" fill="#9a8b7d" font-size="8.5" text-anchor="middle" letter-spacing=".1em">DISCOVERY</text>
        </g>
        <!-- STAGE: AEO (structured data / schema) -->
        <g transform="translate(412,222)">
          <rect x="-40" y="-22" width="80" height="44" rx="6" fill="#150f0a" stroke="rgba(255,168,119,.5)" stroke-width="1.1"/>
          <text x="-33" y="-8" fill="rgba(255,168,119,.85)" font-size="8" font-family="ui-monospace,Menlo,monospace">&lt;/&gt;</text>
          <rect x="-14" y="-13" width="28" height="3.5" rx="1.7" fill="rgba(255,255,255,.28)"/>
          <rect x="-14" y="-6" width="22" height="3.5" rx="1.7" fill="rgba(255,255,255,.16)"/>
          <rect x="-33" y="3" width="18" height="3.5" rx="1.7" fill="rgba(255,168,119,.4)"/>
          <rect x="-11" y="3" width="24" height="3.5" rx="1.7" fill="rgba(255,255,255,.14)"/>
          <rect x="-33" y="11" width="30" height="3.5" rx="1.7" fill="rgba(255,168,119,.28)"/>
          <text x="0" y="-30" fill="#9a8b7d" font-size="8.5" text-anchor="middle" letter-spacing=".1em">AEO / SCHEMA</text>
        </g>

        <!-- agent leaks -->
        <circle class="leak" cx="465" cy="185" r="3.6" fill="#ff5c72"/>
        <circle class="leak" cx="375" cy="170" r="3.6" fill="#ff5c72"/>

        <!-- ============ CONVERGENCE : both -> Checkout -> Revenue ============ -->
        <!-- converging guide lines -->
        <path d="M165 300 L262 330" fill="none" stroke="rgba(111,151,255,.14)" stroke-width="1.4"/>
        <path d="M395 300 L298 330" fill="none" stroke="rgba(255,168,119,.14)" stroke-width="1.4"/>

        <!-- unified CHECKOUT -->
        <g transform="translate(280,360)">
          <rect x="-40" y="-26" width="80" height="52" rx="8" fill="#0f1320" stroke="url(#gMoney)" stroke-width="1.6"/>
          <path d="M-22 -12 h26 l-3.5 14 h-19 z" fill="none" stroke="#ffcda8" stroke-width="1.8" stroke-linejoin="round"/>
          <circle cx="-16" cy="8" r="2.2" fill="#ffcda8"/><circle cx="-2" cy="8" r="2.2" fill="#ffcda8"/>
          <rect x="12" y="-12" width="18" height="5" rx="2.5" fill="rgba(255,255,255,.3)"/>
          <rect x="12" y="-3" width="18" height="11" rx="3" fill="#ffa877"/>
          <text x="0" y="-34" fill="#b7a08c" font-size="9" text-anchor="middle" letter-spacing=".1em">CHECKOUT</text>
        </g>

        <!-- ===== motion guide paths ===== -->
        <path id="pathHuman" d="M70 70 C120 150, 150 240, 200 320 C230 340, 260 350, 280 360" fill="none" stroke="none"/>
        <path id="pathAgent" d="M490 70 C440 150, 410 240, 360 320 C330 340, 300 350, 280 360" fill="none" stroke="none"/>

        <!-- faint visible traces -->
        <path d="M70 70 C120 150, 150 240, 200 320 C230 340, 260 350, 280 360" fill="none" stroke="url(#gHuman)" stroke-width="1.5" opacity=".35"/>
        <path d="M490 70 C440 150, 410 240, 360 320 C330 340, 300 350, 280 360" fill="none" stroke="url(#gAgent)" stroke-width="1.5" opacity=".35"/>

        <!-- unified money exit -->
        <path d="M280 386 L280 420" fill="none" stroke="url(#gMoney)" stroke-width="4.5" opacity=".95" filter="url(#glow)"/>

        <g id="particles"></g>
      </svg>

      <div class="revenue-badge">
        <div class="amt" id="rev">$0</div>
        <div class="cap">converted &amp; climbing</div>
      </div>
    </div>
  </div>
</section>

<script>
(function(){
  const NS="http://www.w3.org/2000/svg";
  const g=document.getElementById("particles");
  const pathHuman=document.getElementById("pathHuman");
  const pathAgent=document.getElementById("pathAgent");
  const lenH=pathHuman.getTotalLength();
  const lenA=pathAgent.getTotalLength();

  function spawn(kind){
    const p=document.createElementNS(NS,"circle");
    const isHuman=kind==="h";
    p.setAttribute("r", isHuman? 3 : 2.4);
    p.setAttribute("fill", isHuman? "#6f97ff" : "#ffb98a");
    p.setAttribute("opacity","0");
    if(!isHuman){p.setAttribute("filter","");}
    g.appendChild(p);
    const dur=2600+Math.random()*1200;
    const path=isHuman?pathHuman:pathAgent;
    const len=isHuman?lenH:lenA;
    const start=performance.now();
    function step(now){
      let t=(now-start)/dur;
      if(t>=1){ g.removeChild(p); return; }
      const pt=path.getPointAtLength(t*len);
      p.setAttribute("cx",pt.x);
      p.setAttribute("cy",pt.y);
      // fade in, brighten toward money at the bottom
      const op = t<0.1? t*8 : (t>0.8? (1-t)*4+0.4 : 1);
      p.setAttribute("opacity", Math.min(1,Math.max(0,op)));
      if(t>0.82){ p.setAttribute("fill", "#ffa877"); }
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  let alt=true;
  setInterval(()=>{ spawn(alt?"h":"a"); if(Math.random()>.5) spawn(alt?"a":"h"); alt=!alt; }, 160);

  // leak points seal shut (shrink + warm flash)
  document.querySelectorAll(".leak").forEach((el,i)=>{
    setTimeout(()=>{
      el.style.transition="r .5s, fill .5s, opacity .6s";
      el.setAttribute("fill","#ffa877");
      setTimeout(()=>{ el.setAttribute("r","0"); el.style.opacity="0"; },380);
    }, 1400 + i*420);
  });

  // revenue counter
  const rev=document.getElementById("rev");
  let target=248910, cur=0, t0=null;
  function tick(ts){
    if(!t0)t0=ts;
    const p=Math.min(1,(ts-t0)/2200);
    const eased=1-Math.pow(1-p,3);
    cur=Math.floor(eased*target);
    rev.textContent="$"+cur.toLocaleString();
    if(p<1)requestAnimationFrame(tick);
    else {
      // keep gently climbing
      setInterval(()=>{ target+=Math.floor(Math.random()*140+40);
        rev.textContent="$"+target.toLocaleString(); },900);
    }
  }
  setTimeout(()=>requestAnimationFrame(tick), 1400);
})();
</script>
</body>
</html>
