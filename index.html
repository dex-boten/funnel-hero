<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FEX — All of your traffic, becomes more revenue</title>
<style>
  :root{
    --bg:#08080c;
    --ink:#f4f5f7;
    --muted:#9aa0ad;
    /* blue base + warm accent so it isn't cold */
    --blue-1:#9cb8ff;
    --blue-2:#6f97ff;
    --blue-3:#3f6bff;
    --warm:#ff9a6b;      /* warm coral accent */
    --warm-2:#ffb98a;
    --human:#6f97ff;
    --agent:#9cb8ff;
    --money:#ffa877;
    --line:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  /* ambient glow */
  .bg-glow{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(620px 420px at 20% 16%, rgba(111,151,255,.16), transparent 60%),
      radial-gradient(560px 380px at 82% 24%, rgba(255,154,107,.13), transparent 60%),
      radial-gradient(900px 620px at 55% 118%, rgba(255,154,107,.10), transparent 60%);
  }
  .grid-overlay{
    position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.25;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:64px 64px;
    mask-image:radial-gradient(circle at 50% 40%, black, transparent 75%);
  }

  nav{
    position:relative;z-index:3;
    display:flex;align-items:center;justify-content:space-between;
    padding:26px 40px;max-width:1280px;margin:0 auto;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.2px}
  .brand .dot{width:13px;height:13px;border-radius:50%;
    background:conic-gradient(from 210deg,var(--blue-1),var(--blue-3),#1e3aaa,var(--blue-2),var(--blue-1));
    box-shadow:0 0 18px rgba(111,151,255,.55)}
  .brand span{font-size:18px;letter-spacing:.14em;font-weight:680}
  .nav-cta{
    font-size:14px;color:var(--muted);border:1px solid var(--line);
    padding:9px 16px;border-radius:999px;text-decoration:none;transition:.2s;
  }
  .nav-cta:hover{color:var(--ink);border-color:rgba(255,255,255,.25)}

  .hero{
    position:relative;z-index:2;
    max-width:1280px;margin:0 auto;
    display:grid;grid-template-columns:1.05fr .95fr;gap:40px;
    align-items:center;
    padding:40px 40px 90px;
    min-height:calc(100vh - 92px);
  }
  .copy{max-width:600px}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);border:1px solid var(--line);
    padding:7px 13px;border-radius:999px;margin-bottom:26px;
    opacity:0;transform:translateY(10px);animation:rise .7s .1s forwards;
  }
  .eyebrow .pulse{width:7px;height:7px;border-radius:50%;background:var(--money);
    box-shadow:0 0 0 0 rgba(95,224,138,.6);animation:ping 2.2s infinite}
  h1{
    font-size:clamp(46px,6.4vw,82px);
    line-height:1.02;letter-spacing:-.025em;font-weight:660;
    margin-bottom:26px;
  }
  h1 .accent{
    background:linear-gradient(100deg,var(--blue-2) 0%,var(--warm) 118%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .h1-l1{display:block;opacity:0;transform:translateY(16px);animation:rise .8s .18s forwards}
  .h1-l2{display:block;opacity:0;transform:translateY(16px);animation:rise .8s .3s forwards}
  .sub{
    font-size:clamp(16px,1.5vw,19px);line-height:1.6;color:var(--muted);
    max-width:520px;margin-bottom:38px;
    opacity:0;transform:translateY(16px);animation:rise .8s .44s forwards;
  }
  .sub b{color:#d7dbe3;font-weight:600}
  .actions{display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    opacity:0;transform:translateY(16px);animation:rise .8s .58s forwards}
  .btn-primary{
    display:inline-flex;align-items:center;gap:11px;
    background:linear-gradient(100deg,#ff8f5e,#ffb488);
    color:#22120a;font-weight:680;font-size:16px;
    padding:16px 30px;border-radius:14px;text-decoration:none;
    box-shadow:0 8px 34px rgba(255,138,90,.32);transition:.25s;
  }
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 44px rgba(255,138,90,.46)}
  .btn-secondary{
    display:inline-flex;align-items:center;gap:10px;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);
    color:var(--ink);font-weight:560;font-size:15px;
    padding:15px 24px;border-radius:14px;text-decoration:none;transition:.25s;
    backdrop-filter:blur(6px);
  }
  .btn-secondary:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.26);transform:translateY(-2px)}
  .btn-secondary .play{
    width:22px;height:22px;border-radius:50%;
    background:rgba(255,255,255,.14);display:grid;place-items:center;
  }

  /* ---- VISUAL ---- */
  .visual{position:relative;height:520px;
    opacity:0;animation:fade 1.1s .5s forwards}
  .stage{position:absolute;inset:0}

  .stream-label{
    position:absolute;top:0;font-size:12px;letter-spacing:.08em;
    text-transform:uppercase;display:flex;align-items:center;gap:7px;color:var(--muted)
  }
  .stream-label .chip{width:9px;height:9px;border-radius:2px}
  .label-human{left:8%}
  .label-human .chip{background:var(--blue-2);box-shadow:0 0 12px var(--blue-2)}
  .label-agent{right:8%}
  .label-agent .chip{background:var(--blue-1);box-shadow:0 0 12px var(--blue-1)}

  svg.flow{position:absolute;inset:0;width:100%;height:100%;overflow:visible}

  .revenue-badge{
    position:absolute;left:50%;bottom:2px;transform:translateX(-50%);
    text-align:center;
  }
  .revenue-badge .amt{
    font-size:38px;font-weight:700;letter-spacing:-.02em;
    background:linear-gradient(100deg,var(--warm),#ffe6d3);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-variant-numeric:tabular-nums;
  }
  .revenue-badge .cap{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}

  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  @keyframes fade{to{opacity:1}}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(95,224,138,.6)}70%{box-shadow:0 0 0 9px rgba(95,224,138,0)}100%{box-shadow:0 0 0 0 rgba(95,224,138,0)}}

  @media(max-width:920px){
    .hero{grid-template-columns:1fr;gap:20px;padding-bottom:60px}
    .visual{height:400px;order:2}
    nav{padding:22px 24px}
    .hero{padding-left:24px;padding-right:24px}
  }
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="grid-overlay"></div>

<nav>
  <div class="brand"><div class="dot"></div><span>FEX</span></div>
</nav>

<section class="hero">
  <div class="copy">
    <h1>
      <span class="h1-l1">All of your traffic,</span>
      <span class="h1-l2">becomes <span class="accent">more revenue.</span></span>
    </h1>
    <p class="sub">
      We turn both <b>human visitors</b> and the <b>agentic traffic</b> buying for them into conversions.
      Measured in dollars, not dashboards.
    </p>
    <div class="actions">
      <a class="btn-primary" href="#">Talk to Sales</a>
      <a class="btn-secondary" href="#">
        Watch Demo
        <span class="play">
          <svg width="9" height="11" viewBox="0 0 10 12" fill="none"><path d="M0 0.8v10.4L10 6 0 0.8Z" fill="#fff"/></svg>
        </span>
      </a>
    </div>
  </div>

  <div class="visual">
    <div class="stage">
      <div class="stream-label label-human"><span class="chip"></span>Humans</div>
      <div class="stream-label label-agent"><span class="chip"></span>AI Agents</div>

      <svg class="flow" viewBox="0 0 480 560" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="gHuman" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#6f97ff" stop-opacity=".0"/>
            <stop offset="1" stop-color="#6f97ff" stop-opacity=".9"/>
          </linearGradient>
          <linearGradient id="gAgent" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#9cb8ff" stop-opacity=".0"/>
            <stop offset="1" stop-color="#9cb8ff" stop-opacity=".9"/>
          </linearGradient>
          <linearGradient id="gMoney" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#6f97ff"/>
            <stop offset="1" stop-color="#ffa877"/>
          </linearGradient>
          <linearGradient id="gFunnelFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#6f97ff" stop-opacity=".10"/>
            <stop offset="1" stop-color="#ffa877" stop-opacity=".10"/>
          </linearGradient>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3.2" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <!-- ===== SOURCE CHIPS (ad platforms) ===== -->
        <g id="sources" font-family="inherit">
          <!-- Meta -->
          <g transform="translate(96,44)">
            <rect x="-30" y="-15" width="60" height="30" rx="15" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.12)"/>
            <path d="M-16 4 C-16 -6 -11 -9 -7 -9 C-2 -9 0 -3 3 2 C6 7 8 9 11 9 C15 9 16 5 16 1" fill="none" stroke="#6f97ff" stroke-width="2.4" stroke-linecap="round"/>
            <text x="0" y="22" fill="#7d8493" font-size="8.5" text-anchor="middle" letter-spacing=".05em">META</text>
          </g>
          <!-- Google -->
          <g transform="translate(240,32)">
            <rect x="-30" y="-15" width="60" height="30" rx="15" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.12)"/>
            <g transform="translate(0,0)">
              <circle cx="0" cy="0" r="8" fill="none" stroke="#9cb8ff" stroke-width="2.6"/>
              <rect x="0" y="-1.4" width="9" height="2.8" fill="#9cb8ff"/>
            </g>
            <text x="0" y="22" fill="#7d8493" font-size="8.5" text-anchor="middle" letter-spacing=".05em">GOOGLE</text>
          </g>
          <!-- TikTok -->
          <g transform="translate(384,44)">
            <rect x="-30" y="-15" width="60" height="30" rx="15" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.12)"/>
            <path d="M2 -9 C2 -3 6 0 11 0 M2 -9 L2 6 C2 9 -1 10 -4 9 C-7 8 -7 4 -4 3 C-2 2.4 0 3 0 3" fill="none" stroke="#ffa877" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <text x="0" y="22" fill="#7d8493" font-size="8.5" text-anchor="middle" letter-spacing=".05em">TIKTOK</text>
          </g>
        </g>

        <!-- ===== FUNNEL ===== -->
        <path d="M70 96 L228 320 L228 470 L252 470 L252 320 L410 96"
              fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1.5"/>
        <path d="M70 96 L410 96 L252 320 L252 470 L228 470 L228 320 Z"
              fill="url(#gFunnelFill)"/>

        <!-- ===== STAGE MOCKUPS: Ad -> Landing -> Cart ===== -->
        <!-- STAGE 1: AD -->
        <g class="stage-card" transform="translate(240,150)">
          <rect x="-52" y="-26" width="104" height="52" rx="7" fill="#0f1320" stroke="rgba(111,151,255,.5)" stroke-width="1.2"/>
          <rect x="-44" y="-18" width="40" height="36" rx="3" fill="rgba(111,151,255,.18)"/>
          <circle cx="-24" cy="0" r="6" fill="rgba(111,151,255,.5)"/>
          <rect x="4" y="-16" width="40" height="5" rx="2.5" fill="rgba(255,255,255,.35)"/>
          <rect x="4" y="-6" width="32" height="4" rx="2" fill="rgba(255,255,255,.18)"/>
          <rect x="4" y="6" width="26" height="9" rx="3" fill="#6f97ff"/>
          <text x="0" y="-38" fill="#8b93a5" font-size="9" text-anchor="middle" letter-spacing=".08em">AD</text>
        </g>
        <!-- STAGE 2: LANDING PAGE -->
        <g class="stage-card" transform="translate(240,250)">
          <rect x="-42" y="-24" width="84" height="48" rx="6" fill="#0f1320" stroke="rgba(156,184,255,.5)" stroke-width="1.2"/>
          <rect x="-42" y="-24" width="84" height="11" rx="6" fill="rgba(156,184,255,.14)"/>
          <rect x="-34" y="-6" width="48" height="5" rx="2.5" fill="rgba(255,255,255,.32)"/>
          <rect x="-34" y="3" width="36" height="4" rx="2" fill="rgba(255,255,255,.16)"/>
          <rect x="-34" y="12" width="22" height="7" rx="3" fill="#9cb8ff"/>
          <rect x="18" y="-6" width="18" height="25" rx="3" fill="rgba(156,184,255,.2)"/>
          <text x="0" y="-32" fill="#8b93a5" font-size="9" text-anchor="middle" letter-spacing=".08em">LANDING</text>
        </g>
        <!-- STAGE 3: CART / CHECKOUT -->
        <g class="stage-card" transform="translate(240,395)">
          <rect x="-30" y="-22" width="60" height="44" rx="6" fill="#0f1320" stroke="rgba(255,168,119,.6)" stroke-width="1.2"/>
          <path d="M-18 -10 h22 l-3 12 h-16 z" fill="none" stroke="#ffa877" stroke-width="1.8" stroke-linejoin="round"/>
          <circle cx="-13" cy="6" r="2" fill="#ffa877"/><circle cx="-1" cy="6" r="2" fill="#ffa877"/>
          <rect x="10" y="-10" width="14" height="4" rx="2" fill="rgba(255,255,255,.3)"/>
          <rect x="10" y="-2" width="14" height="9" rx="3" fill="#ffa877"/>
          <text x="0" y="-30" fill="#8b93a5" font-size="9" text-anchor="middle" letter-spacing=".08em">CHECKOUT</text>
        </g>

        <!-- leak points that seal shut -->
        <circle class="leak" cx="170" cy="200" r="4" fill="#ff5c72"/>
        <circle class="leak" cx="312" cy="165" r="4" fill="#ff5c72"/>
        <circle class="leak" cx="200" cy="290" r="4" fill="#ff5c72"/>

        <!-- stream paths (invisible, motion guides) -->
        <path id="pathHuman" d="M110 72 C150 170, 215 240, 240 320 L240 470" fill="none" stroke="none"/>
        <path id="pathAgent" d="M370 72 C330 170, 265 240, 240 320 L240 470" fill="none" stroke="none"/>

        <!-- faint visible stream traces -->
        <path d="M110 72 C150 170, 215 240, 240 320" fill="none" stroke="url(#gHuman)" stroke-width="1.6" opacity=".4"/>
        <path d="M370 72 C330 170, 265 240, 240 320" fill="none" stroke="url(#gAgent)" stroke-width="1.6" opacity=".4"/>

        <!-- money exit stream (straight down out of checkout) -->
        <path d="M240 470 L240 500" fill="none" stroke="url(#gMoney)" stroke-width="4" opacity=".9" filter="url(#glow)"/>

        <g id="particles"></g>
      </svg>

      <div class="revenue-badge">
        <div class="amt" id="rev">$0</div>
        <div class="cap">converted &amp; climbing</div>
      </div>
    </div>
  </div>
</section>

<script>
(function(){
  const NS="http://www.w3.org/2000/svg";
  const g=document.getElementById("particles");
  const pathHuman=document.getElementById("pathHuman");
  const pathAgent=document.getElementById("pathAgent");
  const lenH=pathHuman.getTotalLength();
  const lenA=pathAgent.getTotalLength();

  function spawn(kind){
    const p=document.createElementNS(NS,"circle");
    const isHuman=kind==="h";
    p.setAttribute("r", isHuman? 3 : 2.4);
    p.setAttribute("fill", isHuman? "#6f97ff" : "#9cb8ff");
    p.setAttribute("opacity","0");
    if(!isHuman){p.setAttribute("filter","");}
    g.appendChild(p);
    const dur=2600+Math.random()*1200;
    const path=isHuman?pathHuman:pathAgent;
    const len=isHuman?lenH:lenA;
    const start=performance.now();
    function step(now){
      let t=(now-start)/dur;
      if(t>=1){ g.removeChild(p); return; }
      const pt=path.getPointAtLength(t*len);
      p.setAttribute("cx",pt.x);
      p.setAttribute("cy",pt.y);
      // fade in, brighten toward money at the bottom
      const op = t<0.1? t*8 : (t>0.8? (1-t)*4+0.4 : 1);
      p.setAttribute("opacity", Math.min(1,Math.max(0,op)));
      if(t>0.7){ p.setAttribute("fill", "#ffa877"); }
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  let alt=true;
  setInterval(()=>{ spawn(alt?"h":"a"); if(Math.random()>.5) spawn(alt?"a":"h"); alt=!alt; }, 160);

  // leak points seal shut (shrink + warm flash)
  document.querySelectorAll(".leak").forEach((el,i)=>{
    setTimeout(()=>{
      el.style.transition="r .5s, fill .5s, opacity .6s";
      el.setAttribute("fill","#ffa877");
      setTimeout(()=>{ el.setAttribute("r","0"); el.style.opacity="0"; },380);
    }, 1400 + i*420);
  });

  // revenue counter
  const rev=document.getElementById("rev");
  let target=248910, cur=0, t0=null;
  function tick(ts){
    if(!t0)t0=ts;
    const p=Math.min(1,(ts-t0)/2200);
    const eased=1-Math.pow(1-p,3);
    cur=Math.floor(eased*target);
    rev.textContent="$"+cur.toLocaleString();
    if(p<1)requestAnimationFrame(tick);
    else {
      // keep gently climbing
      setInterval(()=>{ target+=Math.floor(Math.random()*140+40);
        rev.textContent="$"+target.toLocaleString(); },900);
    }
  }
  setTimeout(()=>requestAnimationFrame(tick), 1400);
})();
</script>
</body>
</html>
